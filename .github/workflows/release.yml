name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Package
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          swift test
          # Strip 'v' prefix if present in github.ref_name for safety, though package.sh also handles it
          export VERSION=${VERSION#v}
          chmod +x package.sh
          ./package.sh

      - name: Compress App
        run: |
          ditto -c -k --keepParent SysMonitor.app SysMonitor.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: SysMonitor.zip
          generate_release_notes: true
